spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: library-manager-api
  threads:
    virtual:
      enabled: true
  profiles:
    active: dev
jwt:
  public:
    key: classpath:app.pub
  private:
    key: classpath:app.key
  expiration-time: 3600
scheduling:
  initial-delay: 10000
  fixed-delay: 3600000
springdoc:
  remove-broken-extensions: true
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method
    filter: true
    show-common-extensions: false
    override-with-generic-response: false